doc_type: contract
schema: dip.schemas.contract.Contract
classifier_hint: >
  Legal agreement between two or more parties. Long prose document with numbered
  clauses covering obligations, term, termination, governing law and signatures.

extraction:
  strategy: field_by_field        # long doc: extract fields in small groups with focused context
  max_output_tokens: 400
  few_shot: config/examples/contract.json
  field_groups:
    - fields: [document_name, contract_type, parties, agreement_date, effective_date]
      source: head
      max_chars: 6000
    - fields: [expiration_or_term, governing_law, renewal_term]
      source: keywords
      window: 1000
      keywords: ["governing law", "governed by", "laws of", "law of the state",
                 "jurisdiction", "renew", "renewal", "extend", "term of this agreement",
                 "initial term", "expire", "expiration", "termination", "shall terminate",
                 "shall commence", "effective date"]
      max_chars: 7000

validation:
  critical_rules:
    - required_fields
  rules:
    - required_fields: [parties, governing_law]
    - at_least_two_parties
    - date_is_valid
  confidence:
    method: logprob_min
    field_threshold: 0.45
    doc_threshold: 0.60

chunking:
  strategy: layout_section
  max_tokens: 640
  overlap: 96
