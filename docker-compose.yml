# Infra for the platform.
#
#   docker compose up -d postgres qdrant      # default: just the datastores (run api/ui on host)
#   docker compose --profile app up -d        # full stack in containers (stretch goal)
#
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dip
      POSTGRES_PASSWORD: dip
      POSTGRES_DB: dip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dip -d dip"]
      interval: 5s
      timeout: 3s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  api:
    profiles: ["app"]
    build: .
    command: uvicorn dip.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://dip:dip@postgres:5432/dip
      QDRANT_URL: http://qdrant:6333
    env_file: [.env]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  ui:
    profiles: ["app"]
    build: .
    command: streamlit run src/dip/ui/app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      DIP_API_URL: http://api:8000
    env_file: [.env]
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
  qdrantdata:
